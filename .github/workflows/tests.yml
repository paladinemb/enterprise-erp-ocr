name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy pillow opencv-python-headless
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/merge-rows.cjs
      - run: node tests/auto-correction.cjs
